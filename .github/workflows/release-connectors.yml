name: Release connectors

# Publishes a GitHub Release for each connector version that doesn't have one
# yet, detected from a new connectors/<app>-vX.Y.Z.tgz or a bumped app_version
# in connectors/source/<app>/<app>.json. The workflow and script are in the path
# filter on purpose: the merge that introduces them also publishes the versions
# already in the repo.
on:
  push:
    branches: [master]
    paths:
      - 'connectors/*.tgz'
      - 'connectors/source/*/*.json'
      - '.github/workflows/release-connectors.yml'
      - '.github/scripts/release-connectors.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-connectors
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags point at the commit that added each package
      - name: Publish missing connector releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release-connectors.sh
